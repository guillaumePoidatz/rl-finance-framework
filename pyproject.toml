[project]

name = "rl-finance-framework"
dynamic = ["version"]
description = "This framework has the ambition to make it easier to develop rl based trading strategy"
authors = [{ name = "guillaume poidatz", email = "79081686+guillaumePoidatz@users.noreply.github.com" }]
license = { text = "GPL-3.0" }
readme = "README.md"
requires-python = ">=3.10,<=3.12"

dependencies = [
  "pandas (>=2.3.0,<3.0.0)",
  "requests",
  "Pillow",
  "gymnasium",
  "dm-tree",
  "pyarrow",
  "scikit-learn >=1.2.2",
  "torch",
  "lz4",
  "pytest",
  "ray>=2.50.0",
  "python-json-logger",
  "pydantic",
  "elegantrl @ git+https://github.com/AI4Finance-Foundation/ElegantRL.git#egg=elegantrl",
  "ccxt",
  "stockstats",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.25.0", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v?(?P<version>\\d+\\.\\d+\\.\\d+(?:-(?:alpha|beta|rc)\\.\\d+)?)$"
