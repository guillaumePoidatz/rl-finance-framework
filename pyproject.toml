[project]

name = "rl-finance-framework"
version = "0.0.0"  # ignoré à la build (placeholder)
description = "This framework has the ambition to make it easier to develop rl based trading strategy"
authors = [{ name = "guillaume poidatz", email = "79081686+guillaumePoidatz@users.noreply.github.com" }]
license = { text = "GPL-3.0" }
readme = "README.md"
requires-python = ">=3.11,<=3.12"

dependencies = [
  "pandas (>=2.3.0,<3.0.0)",
  "requests",
  "Pillow",
  "gymnasium",
  "dm-tree",
  "pyarrow",
  "scikit-learn",
  "torch",
  "lz4",
  "pytest",
  "stable_baselines3",
  "gym",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "semver"                 
pattern = "^v?(?P<base>\\d+\\.\\d+\\.\\d+)(?:-(?P<stage>alpha|beta|rc)\\.(?P<revision>\\d+))?$"
format = "{base}"                
# format = "{base}+{distance}.{commit}"  